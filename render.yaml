# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: verity
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.app:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: VERITY_ENV
        value: production
      - key: VERITY_ENABLE_DOCS
        value: "false"
      - key: VERITY_ENABLE_DEMO
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
