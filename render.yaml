# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: finsync
    # Docker so the Tesseract OCR engine can be installed (see Dockerfile)
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: VERITY_OCR_ENABLED
        value: "true"
      - key: VERITY_ENV
        value: production
      - key: VERITY_ENABLE_DOCS
        value: "false"
      - key: VERITY_ENABLE_DEMO
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
